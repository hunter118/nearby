[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nearby-polymarket-backtest"
version = "0.2.0"
description = "Semantic wallet expert-following research with chronological portfolio replay."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.9",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "requests>=2.31",
  "scikit-learn>=1.5",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
embeddings = [
  "sentence-transformers>=5.1,<5.2",
  "transformers>=4.51,<4.52",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
